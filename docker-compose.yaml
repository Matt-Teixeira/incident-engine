# incident-engine — cron-batch one-shot (no server, no published port).
# Invoke: docker compose run --rm app node index.js <materialize|assess|run>
#   dev:     RUN_USER=<you> docker compose run --rm app node index.js <job>
#   release: omit RUN_USER — docker/entrypoint.sh defaults to svc.
services:
  app:
    image: incident-engine:${USER_ID}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${USER_ID}
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    working_dir: /workspace
    env_file:
      - .env
    environment:
      # Intentionally unset in .env — empty means the entrypoint defaults to
      # svc; dev runs pass it on the CLI. The :- silences the compose warning.
      RUN_USER: ${RUN_USER:-}
      # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
      NPM_CONFIG_CACHE: /tmp/.npm
    volumes:
      # Project source (incl. in-tree node_modules) → live edit on host
      - ./:/workspace
      # Centralized run logs (host:container bind spec, set in .env)
      # TODO(migration): replaced by ${LOG_DIR:-./utils/logger/logs} in the
      # logger-conform commit — do not build new behavior on RUN_LOGS_DIR.
      - ${RUN_LOGS_DIR}
      # Shared PG SSL cert (read-only), for PG_SSLMODE=verify-*
      - /opt/resources/ssl:/opt/resources/ssl:ro
    networks:
      - pg_net

networks:
  pg_net:
    external: true
